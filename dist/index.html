<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>azentio.ai: intelligence portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FB;--surface:#FFFFFF;--sunken:#EFF2F7;--ink:#0A1F3D;--t2:#46566E;--t3:#5B6B85;--line:#E2E8F0;--line2:#CBD5E1;
  --primary:#2F4BFF;--primary-h:#2339DB;--on-primary:#FFFFFF;--primary-soft:#EAEEFF;--violet:#7A5CFF;--cyan:#19C3E6;--mint:#5BF0C2;
  --ok:#067A55;--ok-bg:#E1F7EC;--no:#B42318;--no-bg:#FDECEA;--wait:#92400E;--wait-bg:#FEF1C7;--ai:#5B3FE0;--ai-bg:#EFEBFF;
  --sh1:0 1px 2px rgba(10,31,61,.06);--sh2:0 2px 6px rgba(10,31,61,.06),0 14px 34px -10px rgba(10,31,61,.14);
  --pop:0 40px 80px -24px rgba(36,48,130,.38),0 22px 44px -22px rgba(10,31,61,.3);
  --r:8px;--r2:12px;--r3:18px;--ease:cubic-bezier(.22,1,.36,1);
  --font:'Geist','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --side:260px;--lagoon:var(--primary);--coral:var(--no);--iris:var(--ai);--ink2:var(--t2);--bg2:var(--sunken);--paper:var(--surface);--cta:#0A1F3D;--glow:rgba(47,75,255,.10);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071225;--surface:#0D1B33;--sunken:#0A162B;--ink:#EAF0FB;--t2:#A5B4CC;--t3:#7487A6;--line:#1B2D4B;--line2:#2A4166;
  --primary:#6F82FF;--primary-h:#8999FF;--on-primary:#06122B;--primary-soft:#16275A;--ok:#4FD9A4;--ok-bg:#0F3A2D;--no:#FF8F85;--no-bg:#3C1A1A;--wait:#F5C25B;--wait-bg:#3A2B08;--ai:#B3A3FF;--ai-bg:#241B58;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 2px 6px rgba(0,0,0,.35),0 14px 34px -10px rgba(0,0,0,.6);--pop:0 40px 80px -24px rgba(0,0,0,.7);--cta:#16226B;--glow:rgba(111,130,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071225;--surface:#0D1B33;--sunken:#0A162B;--ink:#EAF0FB;--t2:#A5B4CC;--t3:#7487A6;--line:#1B2D4B;--line2:#2A4166;
  --primary:#6F82FF;--primary-h:#8999FF;--on-primary:#06122B;--primary-soft:#16275A;--ok:#4FD9A4;--ok-bg:#0F3A2D;--no:#FF8F85;--no-bg:#3C1A1A;--wait:#F5C25B;--wait-bg:#3A2B08;--ai:#B3A3FF;--ai-bg:#241B58;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 2px 6px rgba(0,0,0,.35),0 14px 34px -10px rgba(0,0,0,.6);--pop:0 40px 80px -24px rgba(0,0,0,.7);--cta:#16226B;--glow:rgba(111,130,255,.14);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em;line-height:1.12;color:var(--ink)}
h1{font-size:clamp(2.4rem,4.6vw,3.7rem);letter-spacing:-.04em;line-height:1.02;font-weight:600}
h2{font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.034em}h3{font-size:1.15rem;letter-spacing:-.018em}h4{font-size:.95rem;letter-spacing:-.01em}
p{margin:0}a{color:var(--primary)}button{font:inherit;color:inherit;cursor:pointer}
.muted{color:var(--t2)}.faint{color:var(--t3)}.small{font-size:.86rem}.tiny{font-size:.77rem}.b{font-weight:600}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}.pad{padding-top:64px;padding-bottom:90px}

/* ---------- buttons, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;font-weight:550;font-size:.9rem;background:var(--primary);color:var(--on-primary);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .22s var(--ease),background .15s,box-shadow .25s var(--ease),border-color .15s;white-space:nowrap}
.btn:hover{background:var(--primary-h);box-shadow:0 8px 18px -8px var(--primary)}.btn:active{scale:.97}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2);box-shadow:var(--sh1)}.btn.ghost:hover{background:var(--sunken);border-color:var(--t3);box-shadow:var(--sh1)}
.btn.warn{background:var(--no);color:#fff;box-shadow:var(--sh1)}.btn.sm{height:30px;padding:0 11px;font-size:.82rem}
.btn.lg{height:48px;padding:0 24px;border-radius:999px;font-size:1rem}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}.btn:hover svg{transform:translateX(3px)}
.btn:disabled{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:550;text-decoration:none}.link:hover{text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:.75rem;font-weight:550;background:var(--sunken);color:var(--t2);white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.no{background:var(--no-bg);color:var(--no)}.chip.wait{background:var(--wait-bg);color:var(--wait)}.chip.ai{background:var(--ai-bg);color:var(--ai)}
button.chip{cursor:pointer;border-color:var(--line)}button.chip.ok{border-color:transparent}
.dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#D92D20;color:#fff;font-size:.68rem;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:600;color:#fff;flex:none;letter-spacing:0}
.ibtn{position:relative;width:34px;height:34px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--t2);transition:background .15s,color .15s,transform .2s var(--ease)}
.ibtn:hover{background:var(--sunken);color:var(--ink)}.ibtn:active{transform:scale(.92)}
.ibtn svg,.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- marketing header ---------- */
.banner{background:var(--ink);color:var(--bg);text-align:center;font-size:.82rem;padding:7px 16px;letter-spacing:-.005em}
.mh{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;transition:border-color .3s,box-shadow .3s;border-bottom:1px solid transparent;background:color-mix(in srgb,var(--surface) 74%,transparent);backdrop-filter:saturate(1.6) blur(16px)}
.mh.scrolled{border-color:var(--line);box-shadow:0 1px 0 rgba(10,31,61,.02),0 8px 24px -16px rgba(10,31,61,.18);background:color-mix(in srgb,var(--surface) 88%,transparent)}
.mh-in{max-width:1200px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:1.12rem;letter-spacing:-.035em;background:none;border:0;padding:0;color:var(--ink)}.logo svg{width:28px;height:28px}
.mnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}.mnav::-webkit-scrollbar{display:none}
.mnav button{border:0;background:none;padding:7px 12px;border-radius:var(--r);font-weight:500;font-size:.9rem;color:var(--t2);white-space:nowrap;position:relative;transition:color .15s,background .15s}
.mnav button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}.mnav button[aria-current="page"]{color:var(--ink)}
.mnav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--primary)}
.tools{display:flex;gap:8px;align-items:center}

/* ---------- app shell ---------- */
body.app #shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
#side{display:none}
body.app #side{display:block}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
.side .logo{padding:4px 8px 14px}
.wsb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:14px;transition:border-color .2s}
.wsb:hover{border-color:var(--line2)}.wsb .sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:650;font-size:.8rem;background:linear-gradient(135deg,var(--primary),var(--violet));flex:none}
.wsb .av,.me .av{color:#fff}.wsb b{display:block;font-size:.86rem;font-weight:600;line-height:1.2;color:var(--ink)}.wsb .sq{color:#fff}.wsb span:not(.sq){font-size:.75rem;color:var(--t3)}
.snav{position:relative;display:flex;flex-direction:column;gap:1px;overflow:auto;flex:1}
.grp{font-size:.74rem;font-weight:600;color:var(--t3);padding:14px 10px 6px;letter-spacing:0}
.snav button.it{position:relative;z-index:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:var(--r);font-weight:500;font-size:.9rem;color:var(--t2);transition:color .15s,background .15s}
.snav button.it:hover{background:color-mix(in srgb,var(--ink) 4.5%,transparent);color:var(--ink)}
.snav button.it[aria-current="page"]{color:var(--primary);font-weight:600}
.snav .pill{position:absolute;left:0;right:0;top:0;height:0;border-radius:var(--r);background:var(--primary-soft);z-index:0}
.snav .pill::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px;border-top:1px solid var(--line);margin:8px -12px -16px;padding-left:22px;transition:background .15s}
.me:hover{background:var(--sunken)}.me .av{color:#fff;font-size:.7rem}.me b{display:block;font-size:.84rem;line-height:1.2;color:var(--ink)}.me span:not(.av){font-size:.74rem;color:var(--t3)}
.app-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;height:56px;padding:0 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--t3)}.crumb b{color:var(--ink);font-weight:600}
.burger{display:none}
.app-main{padding:30px 32px 90px;max-width:1240px}
#navscrim{position:fixed;inset:0;background:rgba(7,18,37,.45);z-index:44;display:none}

/* ---------- page header, cards, grids ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.ph h2{font-size:1.65rem;letter-spacing:-.03em}.ph p{margin-top:6px;color:var(--t2);max-width:62ch}
body.site .ph h2{font-size:clamp(2rem,4vw,3rem);letter-spacing:-.04em}body.site .ph p{font-size:1.08rem;max-width:58ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:20px;box-shadow:var(--sh1);transition:box-shadow .3s var(--ease),border-color .2s;min-width:0}
.card.lift:hover{box-shadow:var(--sh2);border-color:var(--line2)}
.card.flat{box-shadow:none}.card.soft{background:var(--sunken);box-shadow:none}.card.tight{padding:14px;border-radius:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}.gs{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}.grid>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:56px}.sec-h{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.scroll-x{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:.88rem}.card table{display:block;overflow-x:auto;max-width:100%}
th{text-align:left;font-size:.78rem;color:var(--t3);font-weight:550;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr{transition:background .12s}tbody tr:hover{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.item{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item>*{min-width:0}.small,.b{overflow-wrap:anywhere}
.empty{text-align:center;padding:32px 20px;border:1px dashed var(--line2);border-radius:var(--r2);color:var(--t2);background:var(--surface)}.empty h4{color:var(--ink);margin-bottom:4px;font-size:1rem}
.deny{border:1px solid color-mix(in srgb,var(--no) 35%,transparent);background:var(--no-bg);border-radius:var(--r2);padding:18px}.deny h4{color:var(--no)}
.note{display:flex;gap:10px;padding:11px 14px;border-radius:10px;background:var(--primary-soft);color:var(--ink);font-size:.86rem;line-height:1.5}
.note.warn{background:var(--wait-bg)}.note.ok{background:var(--ok-bg)}
.kpi{font-weight:600;font-size:1.9rem;letter-spacing:-.04em;line-height:1.1}
.flag{background:var(--wait-bg);color:var(--wait);padding:0 5px;border-radius:4px;font-weight:600}
.spark{display:flex;align-items:end;gap:4px;height:90px}.spark i{flex:1;background:var(--primary);border-radius:4px 4px 1px 1px;min-height:3px;transform-origin:bottom;opacity:.9}.spark i.neg{background:var(--no)}
.media{aspect-ratio:16/9;border-radius:10px;background:radial-gradient(120% 120% at 20% 0%,#2a3fd6 0%,#0A1F3D 60%);color:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.media .play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .35s var(--ease)}.card:hover .media .play{transform:scale(1.1)}.media .tag{position:absolute;left:10px;top:10px}
.wave{display:flex;gap:4px;align-items:center;height:40px}.wave i{width:4px;border-radius:2px;background:var(--cyan);height:10px}

/* ---------- forms ---------- */
.f{display:flex;flex-direction:column;gap:6px}.f label,.lbl{font-weight:550;font-size:.84rem}
.in,select.in,textarea.in{width:100%;height:38px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem;transition:border-color .15s,box-shadow .2s}
textarea.in{height:auto;min-height:104px;padding:10px 12px;resize:vertical}
.in:hover{border-color:var(--t3)}.in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.err{color:var(--no);font-size:.8rem;font-weight:550}.in.bad{border-color:var(--no)}.help{font-size:.8rem;color:var(--t3)}
.check{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;font-size:.9rem}
.check:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}.check input{margin-top:3px;accent-color:var(--primary);width:16px;height:16px;flex:none}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.seg{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;max-width:100%}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 12px;font-weight:500;font-size:.9rem;color:var(--t2);white-space:nowrap;transition:color .15s}
.seg button:hover{color:var(--ink)}.seg button[aria-selected="true"]{color:var(--ink);font-weight:600}
.seg .pill{position:absolute;bottom:-1px;top:auto;left:0;height:2px;width:0;background:var(--primary);border-radius:2px}

/* ---------- lifecycle ---------- */
.life{display:flex;align-items:center;overflow-x:auto;padding:6px 2px 10px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px;text-align:center;font-size:.76rem;font-weight:550;color:var(--t3)}
.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);background:var(--surface);font-size:.74rem;transition:all .5s var(--ease)}
.step.done b{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.step.now b{border-color:var(--primary);box-shadow:0 0 0 5px var(--primary-soft);color:var(--primary)}.step.now{color:var(--ink)}
.step.bad b{background:var(--no);border-color:var(--no);color:#fff}
.bar{flex:1;height:2px;min-width:22px;background:var(--line);margin-bottom:22px;position:relative;overflow:hidden}.bar i{position:absolute;inset:0;background:var(--primary);transform-origin:left;transform:scaleX(0)}.bar.on i{transform:scaleX(1)}

/* ---------- persona widget ---------- */
.personas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.personas button{display:flex;gap:7px;align-items:center;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:3px 11px 3px 3px;font-weight:550;font-size:.8rem;transition:all .2s var(--ease)}
.personas button:hover{border-color:var(--t3)}.personas button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--ink)}.personas button:active{transform:scale(.96)}
.ver{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 13px;border-radius:10px;border:1px solid var(--line);margin-top:8px;background:var(--surface);transition:border-color .3s,background .3s}
.ver.yes{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-bg)}.ver.nope{background:var(--no-bg);border-color:transparent}
.ver .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent)}

/* ---------- landing ---------- */
.hero2{position:relative;overflow:hidden;margin-top:-64px;padding-top:64px}@media (max-width:700px){.hero2{margin-top:-96px;padding-top:96px}}
.ribbon{position:absolute;left:55%;right:-22%;top:-200px;height:660px;transform:skewY(-11deg);background:linear-gradient(115deg,#2F4BFF 0%,#6A55FF 32%,#19C3E6 68%,#5BF0C2 100%);background-size:200% 200%;animation:flow 14s ease-in-out infinite alternate;opacity:.95;z-index:0}
.ribbon::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 15% 100%,rgba(255,255,255,.35),transparent 60%)}
@keyframes flow{to{background-position:100% 60%}}
.hero2-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:56px;align-items:center;padding-top:76px;padding-bottom:104px}
.hero2-copy .lede{font-size:1.2rem;line-height:1.55;color:var(--t2);max-width:50ch;margin-top:22px}
.hero2-copy .row{margin-top:30px}.hero2::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(55% 75% at 22% 45%,#000,transparent);mask-image:radial-gradient(55% 75% at 22% 45%,#000,transparent);opacity:.8;z-index:0}.hero2-copy .fine{margin-top:18px;font-size:.84rem;color:var(--t3)}
.mock{perspective:1400px;position:relative;width:100%;max-width:610px;margin-left:auto;aspect-ratio:610/630}

/* ------------------- sensitive content scan (advisory) ------------------- */
function scan(t) {
  const f = [], seen = new Set();
  const add = (type, m, why) => { const k = type + m.toLowerCase(); if (!seen.has(k)) { seen.add(k); f.push({ type, match: m, why }); } };
  (t.match(/[\w.+-]+@[\w-]+\.[\w.]+/g) || []).forEach(m => add('identity', m, 'Email address'));
  (t.match(/\bACC\s?\d+/gi) || []).forEach(m => add('identity', m, 'Looks like an account reference'));
  (t.match(/\b\d{7,}\b/g) || []).forEach(m => add('identity', m, 'Long number that may identify an account'));
  DB.orgs.forEach(o => { const w = o.name.split(' ')[0]; if (new RegExp('\\b' + w + '\\b', 'i').test(t)) add('identity', w, 'Organisation name'); });
  (t.match(/\b(confidential|contractual|contract|NDA|password|secret|api key|credentials?)\b/gi) || []).forEach(m => add('restricted', m, 'Restricted topic'));
  (t.match(/[£$€]\s?\d[\d,.]*k?/g) || []).forEach(m => add('pricing', m, 'Monetary figure'));
  (t.match(/\b(Leeds|Manchester|Glasgow|Cork|Bristol)\b/g) || []).forEach(m => add('geo', m, 'Specific location'));
  return f;
}

function indexPurge(sid) {
  const t0 = performance.now();

}

    requestCode(email) {

      if (!emailOk(email)) return fail('Enter a valid work email address.');

    },
    verify(email, code, token) {

      c.tries++;
      if (c.code !== String(code || '').trim()) return fail('That code doesn’t match. Check the digits and try again.');
      delete api._codes[email];
      if (token) {
        const inv = DB.invites.find(i => i.token === token);
        if (!inv || inv.state !== 'Pending' || new Date(inv.exp) < new Date() || inv.email !== email) return fail('This invitation is invalid, expired, or meant for a different account.');

      }

        if (!u || !u.employee) return fail('Your @azentio.com identity is verified, but you haven’t been approved for the portal yet. Ask the hackathon organisers to provision you.');
        S.uid = u.id; S.org = null; audit('auth.signin', u.id, 'Employee sign-in'); return { ok: true, data: { signedIn: true } };

    return { kind: 'cda', scenario: s.name, inputs: i, score, rules, verdict: rules.every(r => r[1]) ? 'Sandbox suggestion: proceed to analyst review' : 'Sandbox suggestion: refer for closer review', narrative: ai ? '' + rules.filter(r => !r[1]).length + ' of 3 policy rules were not met. A human analyst makes the decision.' : null };

}

function fedCurve(r) {
  const W = 520, H = 190, px = i => 40 + i * (W - 60) / 5, py = a => H - 24 - (a - .4) / .6 * (H - 50);
  const line = (a, c, d) => `<line x1="40" x2="${W - 20}" y1="${py(a)}" y2="${py(a)}" stroke="${c}" stroke-dasharray="${d}" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Global model accuracy by round"><g stroke="var(--line)">${[.5, .7, .9].map(a => `<line x1="40" x2="${W - 20}" y1="${py(a)}" y2="${py(a)}"/>`).join('')}</g>
  <g fill="var(--t2)" font-size="11">${[.5, .7, .9].map(a => `<text x="4" y="${py(a) + 4}">${Math.round(a * 100)}%</text>`).join('')}${r.curve.map(c => `<text x="${px(c.r) - 4}" y="${H - 6}">${c.r}</text>`).join('')}</g>
  ${line(r.baseline.majority, 'var(--no)', '5 4')}${line(r.baseline.localOnly, 'var(--ai)', '2 4')}
  <polyline fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${r.curve.map(c => px(c.r) + ',' + py(c.acc)).join(' ')}"/>${r.curve.map(c => `<circle cx="${px(c.r)}" cy="${py(c.acc)}" r="4" fill="var(--primary)"/>`).join('')}</svg>
  <div class="row small"><span class="chip ok">Global model</span><span class="chip no">Majority-class baseline ${(r.baseline.majority * 100).toFixed(0)}%</span><span class="chip ai">Client A alone ${(r.baseline.localOnly * 100).toFixed(0)}%</span></div>`;
}
P.federated = u => {
  if (u.kind !== 'employee') return head('Federated lab') + denied('The federated lab is employee-only.');
  const f = UI.fed = UI.fed || { dropout: false, poison: false, clip: 1, withC: false, round: 1, run: null };
  const reg = api.fed.registry(); const r = f.run;
  let out = `<div class="empty"><h4>No run yet</h4><p>Pick the conditions, then run five rounds of local training and aggregation.</p></div>`;
  if (r) {
    const rd = r.rounds[Math.min(f.round, 5) - 1];
    out = `<h4 style="margin-bottom:8px">Global accuracy on a separate holdout</h4>${fedCurve(r)}
    <div style="margin:16px 0 8px">${seg('fround', [1, 2, 3, 4, 5].map(i => [String(i), 'Round ' + i]), String(f.round))}</div>
    ${rd.skipped ? `<div class="note warn"><span>This round was skipped: fewer than 3 eligible updates.</span></div>` : ''}

const fx = { token: 0 };

function setupReveal() {
  const els = $$('.reveal:not(.shown)'); if (!els.length) return;

  if (Mo && Mo.inView) {

        else anim(el, { opacity: [0, 1], y: [36, 0] }, { type: 'spring', stiffness: 105, damping: 19, delay: d });

    if (el.dataset.submit === '1') { const s = api.obs.submit(r.data.id); if (!s.ok) { showErrors(root, s.errors); toast('Saved as a draft, but not submitted: ' + firstErr(s), 'no'); render(false); return; } toast('Submitted for review'); }
    else toast(r.data.status === 'Submitted' ? 'New version sent for renewed review' : 'Draft saved. Still private.');
    closeModal(); render(false);
  },
  submitObs(el) { const r = api.obs.submit(el.dataset.id); if (!r.ok) { toast(firstErr(r), 'no'); return; } toast('Submitted for review'); closeModal(); render(false); },
  withdraw(el) {
    const r = api.obs.get(el.dataset.id); if (!res(r)) return; const o = r.data;
    openModal(`<h3>Withdraw this contribution?</h3><p class="muted" style="margin:8px 0 12px">“${esc(o.title)}”</p>${o.live ? `<div class="note warn"><span>The shared copy will be removed from search, cache and AIRA retrieval right away. We can’t recall material people already viewed or copied.</span></div>` : `<div class="note"><span>It isn’t shared, so withdrawing just closes it.</span></div>`}<div class="row" style="margin-top:16px"><button class="btn warn" data-act="withdrawGo" data-id="${o.id}">Withdraw now</button><button class="btn ghost" data-act="close">Keep it</button></div>`);
  },
  withdrawGo(el) {
    const r = api.obs.withdraw(el.dataset.id); if (!res(r)) return; const t = r.data.obs.title;
    if (r.data.purge) { $('#modal').innerHTML = purgeView(r.data.purge, t); anim($$('[data-purge]'), { opacity: [0, 1], x: [-16, 0] }, { delay: stag(.28), duration: .5, ease: EASE }); } else { toast('Withdrawn'); closeModal(); }
    render(false);
  },

  /* shared learning */
  bm(el) { if (res(api.shared.bookmark(el.dataset.id))) refreshFeed(); },
  comments(el) { UI.openC[el.dataset.id] = !UI.openC[el.dataset.id]; refreshFeed(); },
  addc(el) { const root = formOf(el), r = api.shared.addComment(el.dataset.id, fv(root).t); if (res(r, 'Comment posted')) refreshFeed(); },
  repc(el) { res(api.shared.reportComment(el.dataset.id), 'Reported. A moderator will review it.'); },
  report(el) { openModal(`<div data-form="rpt"><h3>Report this contribution</h3><p class="muted small" style="margin:6px 0 12px">Tell us what looks misleading, confidential or inappropriate. You don’t need to say which organisation wrote it.</p><textarea class="in" data-f="reason"></textarea><div class="row" style="margin-top:14px"><button class="btn" data-act="sendReport" data-id="${el.dataset.id}">Send report</button><button class="btn ghost" data-act="close">Cancel</button></div></div>`); },
  sendReport(el) { const root = formOf(el), r = api.shared.report(el.dataset.id, fv(root).reason); if (!r.ok) { toast(r.reason, 'no'); return; } toast('Report sent'); closeModal(); },
  savesearch() { res(api.shared.saveSearch(Object.assign({}, UI.feed)), 'Search saved'); },
  export() { const r = api.shared.exportCsv(UI.feed); if (!res(r)) return; openModal(`<h3>Export preview</h3><p class="muted small" style="margin:6px 0 10px">The export applies the same visibility rules as the feed, so it contains approved, de-identified fields only.</p><textarea class="in" readonly style="min-height:200px;font-size:.85rem">${esc(r.data)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="close">Close</button></div>`); },
  aira(el) {
    const r = api.aira.ask(fv(formOf(el)).q); const out = $('#airaOut'); if (!r.ok) { toast(r.reason, 'no'); return; }
    out.innerHTML = `<div class="note ok"><span>${chip('AIRA, from approved contributions only', 'ai')}<br><br>${esc(r.data.answer)}</span></div>${r.data.cites.length ? `<div class="row" style="margin-top:10px"><span class="small b">Sources:</span>${r.data.cites.map(c => chip(c.title)).join('')}</div>` : ''}`; anim(out, { opacity: [0, 1], y: [10, 0] }, { duration: .5, ease: EASE });
  },

  /* moderation */
  review(el) { const c = api.review.claim(el.dataset.id); if (!res(c)) return; const r = api.obs.get(el.dataset.id); if (!res(r)) return; openModal(reviewWorkspace(r.data), true); render(false); },
  pub(el) { const root = formOf(el), f = fv(root); const r = api.review.publish(f.id, { title: f.title, summary: f.summary, industry: f.industry, region: f.region, period: f.period, theme: f.theme, quality: f.quality, attribution: f.attribution }); if (!r.ok) { showErrors(root, r.errors); toast(r.reason, 'no'); return; } toast('Published. Shared copy is now searchable.'); closeModal(); render(false); },
  clar(el) { const f = fv(formOf(el)); if (res(api.review.clarify(f.id, f.reason), 'Returned to the author')) { closeModal(); render(false); } },
  rej(el) { const f = fv(formOf(el)); if (res(api.review.reject(f.id, f.rcode, f.reason), 'Rejected. The author was told why.')) { closeModal(); render(false); } },
  unpub(el) { const r = api.review.unpublish(el.dataset.id, 'Report review'); if (res(r, 'Unpublished. Cleared from search and AIRA immediately.')) render(false); },
  resrep(el) { if (res(api.review.resolveReport(el.dataset.id, el.dataset.o), 'Decision recorded')) render(false); },

  /* ideas */
  newIdea() { openModal(ideaForm(), true); },
  createIdea(el) { const root = formOf(el), r = api.ideas.create(fv(root)); if (!r.ok) { showErrors(root, r.errors); toast(r.reason, 'no'); return; } toast('Idea created as Proposed'); closeModal(); render(false); },
  setStatus(el) { const f = fv(formOf(el)); if (res(api.ideas.setStatus(el.dataset.id, f.status, f.vis, f.update), 'Status saved and audited')) render(false); },

  /* lab */
  vote(el) { if (res(api.lab.vote(el.dataset.id))) render(false); },
  submitExp(el) { if (res(api.lab.submit(fv(formOf(el)).title), 'Experiment submitted')) render(false); },
  libfb(el) { if (res(api.lab.feedback(el.dataset.id, el.dataset.v === '1'), 'Thanks. The owner sees this.')) render(false); },

  /* publisher, admin */
  banner(el) { if (res(api.content.setBanner(fv(formOf(el)).text), 'Banner published')) render(false); },
  aud(el) { const f = fv(formOf(el)); if (res(api.content.setAudience(el.dataset.id, f.aud, f.orgs), 'Audience saved and audited')) render(false); },
  setk(el) { if (res(api.admin.setThreshold(fv(formOf(el)).k), 'Threshold updated')) render(false); },
  grant(el) { const r = api.admin.setGrant(el.dataset.u, el.dataset.g, el.checked); if (!r.ok) { el.checked = !el.checked; toast(r.reason, 'no'); } else toast('Grant updated and audited'); },
  support(el) { const f = fv(formOf(el)); if (res(api.admin.supportAuthorise(f.obs, f.reason), 'Support access authorised for 15 minutes. The author was notified.')) render(false); },
  trypeek(el) { const f = fv(formOf(el)), r = api.obs.get(f.obs); if (r.ok) openModal(`<h3>Support view</h3><p class="note warn" style="margin:10px 0"><span>Opened under a time-boxed support authorisation. This read is audited.</span></p><p class="b">${esc(r.data.title)}</p><p style="margin-top:8px">${esc(r.data.body)}</p><div class="row" style="margin-top:14px"><button class="btn" data-act="close">Close</button></div>`); else openModal(denied(r.reason) + `<div class="row" style="margin-top:14px"><button class="btn" data-act="close">Close</button></div>`); },

  /* team */
  role(el) { if (res(api.org.setRole(el.dataset.u, el.value), 'Role updated')) render(false); else render(false); },
  invite(el) { const f = fv(formOf(el)), r = api.org.invite(f.email, f.role); if (!r.ok) { toast(r.reason, 'no'); return; } toast('Invitation created. Code: ' + r.data.token); render(false); },
  escalate() { const r = api.org.invite('someone@northwind.example', 'portal_admin'); toast(r.ok ? 'Unexpected: allowed' : r.reason, r.ok ? '' : 'no'); },
  revoke(el) { if (res(api.org.revoke(el.dataset.id), 'Invitation revoked')) render(false); },
  ticket(el) { const f = fv(formOf(el)), r = api.org.tickets.create(f.subject, f.body); if (res(r, 'Ticket ' + (r.data && r.data.id) + ' sent to the support desk')) render(false); },

  /* federated */
  fopt(el) { UI.fed[el.dataset.k] = el.checked; },
  fclip(el) { UI.fed.clip = parseFloat(el.value); const c = $('#clipv'); if (c) c.textContent = el.value; },
  fedrun() { const f = UI.fed, r = api.fed.run({ dropout: f.dropout, poison: f.poison, clip: f.clip, withdrawn: f.withC ? ['Client C'] : [] }); if (!res(r)) return; f.run = r.data; f.round = 1; render(false); toast('Five rounds complete'); },
  fedreg(el) { const r = api.fed.register(el.dataset.id); if (res(r, 'Registered as a candidate. Not deployed.')) { UI.fed.run = r.data; render(false); } },
  feddec(el) { const r = api.fed.decide(el.dataset.id, el.dataset.d); if (res(r, 'Decision recorded')) { UI.fed.run = r.data; render(false); } },

  /* walkthrough + probes */
  tour() { openDrawer('tour', tourHtml()); },
  tourgo(el) { const s = TOUR[+el.dataset.i]; if (s.who) api.auth.judgeShortcut(s.who); else api.auth.signOut(); UI.sb = {}; if (s.r === 'learning') UI.tab.learn = 'themes'; closeDrawers(true); go(s.r); toast(s.t); },
  probe(el) { const r = PROBES[el.dataset.p](); toast(r.ok ? 'Allowed for this user (see the log for the checks)' : r.reason, r.ok ? '' : 'no'); }
});

document.addEventListener('click', e => {
  if (e.target.id === 'navscrim') { document.body.classList.remove('nav-open'); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'scrim') closeModal(); return; }
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'range') return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target; if (el.dataset && el.dataset.feed) { UI.feed[el.dataset.feed] = el.value; refreshFeed(); return; }
  if (el.dataset && el.dataset.act && (el.tagName === 'SELECT' || el.type === 'checkbox')) { const fn = ACT[el.dataset.act]; if (fn) fn(el, e); }
});
let ft; document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.feed) { UI.feed[el.dataset.feed] = el.value; clearTimeout(ft); ft = setTimeout(refreshFeed, 160); }
  if (el.dataset && el.dataset.liveScan !== undefined) { const fl = scan(el.value), out = $('#scanOut'); if (out) out.innerHTML = fl.length ? `<div class="note warn"><span><b>Heads up:</b> this looks like it may contain ${fl.map(f => `<span class="flag">${esc(f.match)}</span>`).join(' ')}. Remove identifying details. A moderator will check too.</span></div>` : ''; }
  if (el.dataset && el.dataset.act === 'fclip') ACT.fclip(el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('resize', () => placePills(false));
window.addEventListener('scroll', () => { const h = $('.mh'); if (h) h.classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== UI.route && (P[h])) { UI.route = h; render(true); } });

/* boot */
(function init() {
  const h = (location.hash || '').slice(1); if (h && P[h]) UI.route = h;
  fxMode(); initScroll();
  render(true);
})();

</script>
</body>
</html>
